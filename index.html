<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>📅 當值排班月曆 App</title>
    <!-- 引入 PDF.js 用於直接讀取及預覽每月上傳的 PDF 更表 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <style>
        :root {
            --bg-dark: #0F172A;
            --bg-card: #1E293B;
            --text-main: #F8FAFC;
            --text-muted: #94A3B8;
            --primary: #38BDF8;
            --border: rgba(255, 255, 255, 0.08);

            /* 對應原圖更表配色 */
            --reg-bg: rgba(34, 197, 94, 0.16);
            --reg-border: #22C55E;
            --reg-text: #4ADE80;

            --long-bg: rgba(59, 130, 246, 0.18);
            --long-border: #3B82F6;
            --long-text: #60A5FA;

            --night-bg: rgba(245, 158, 11, 0.2);
            --night-border: #F59E0B;
            --night-text: #FBBF24;

            --off-bg: rgba(255, 255, 255, 0.02);
        }

        * {
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            margin: 0;
            padding: 14px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding-bottom: 60px;
        }

        .container {
            width: 100%;
            max-width: 500px;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        /* 頂部標題與上傳按鈕 */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .header-title h2 {
            margin: 0;
            font-size: 20px;
            color: var(--text-main);
            letter-spacing: 0.5px;
        }
        .header-title p {
            margin: 3px 0 0 0;
            font-size: 12px;
            color: var(--primary);
            font-weight: bold;
        }
        .upload-trigger-btn {
            background: linear-gradient(135deg, #38BDF8 0%, #2563EB 100%);
            color: #fff;
            border: none;
            padding: 10px 14px;
            border-radius: 12px;
            font-size: 13px;
            font-weight: 800;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3);
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .upload-trigger-btn:active { transform: scale(0.96); }

        /* 今日與聽日當值狀態卡 */
        .today-banner {
            background: linear-gradient(135deg, #1E293B 0%, #0F172A 100%);
            border: 1px solid rgba(56, 189, 248, 0.35);
            border-radius: 18px;
            padding: 16px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.3);
        }
        .banner-col {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .banner-col:first-child {
            border-right: 1px solid var(--border);
            padding-right: 10px;
        }
        .banner-label {
            font-size: 11px;
            color: var(--text-muted);
            font-weight: bold;
        }
        .banner-shift {
            font-size: 18px;
            font-weight: 900;
        }
        .banner-time {
            font-size: 13px;
            color: var(--text-main);
            font-weight: bold;
        }
        .banner-sub {
            font-size: 11px;
            color: var(--text-muted);
        }

        /* 全月統計 4 格看板 */
        .stats-bar {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
        }
        .stat-pill {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 10px 6px;
            text-align: center;
        }
        .stat-pill span {
            display: block;
            font-size: 10px;
            color: var(--text-muted);
            margin-bottom: 3px;
        }
        .stat-pill strong {
            font-size: 15px;
            color: var(--text-main);
            font-weight: 900;
        }

        /* 月份切換與印仔模式控制列 */
        .calendar-controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--bg-card);
            padding: 10px 14px;
            border-radius: 14px;
            border: 1px solid var(--border);
        }
        .month-nav {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .nav-arrow {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid var(--border);
            color: var(--text-main);
            width: 32px;
            height: 32px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
        }
        .month-title {
            font-size: 16px;
            font-weight: 900;
            letter-spacing: 0.5px;
        }
        .stamp-toggle-btn {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid var(--border);
            color: var(--text-muted);
            padding: 7px 11px;
            border-radius: 9px;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
        }
        .stamp-toggle-btn.active {
            background: rgba(251, 191, 36, 0.2);
            border-color: #FBBF24;
            color: #FBBF24;
        }

        /* 快速排班印仔工具列 (開啟時顯示) */
        .stamp-bar {
            display: none;
            background: var(--bg-card);
            border: 1px solid rgba(251, 191, 36, 0.4);
            border-radius: 14px;
            padding: 12px;
            flex-direction: column;
            gap: 8px;
        }
        .stamp-list {
            display: flex;
            gap: 6px;
            overflow-x: auto;
            padding-bottom: 4px;
        }
        .stamp-chip {
            border: 1px solid var(--border);
            background: rgba(0, 0, 0, 0.3);
            color: var(--text-main);
            padding: 7px 10px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: bold;
            white-space: nowrap;
            cursor: pointer;
        }
        .stamp-chip.selected {
            outline: 2px solid #FBBF24;
            background: rgba(251, 191, 36, 0.15);
        }

        /* 月曆網格 */
        .calendar-card {
            background: var(--bg-card);
            border-radius: 18px;
            padding: 12px;
            border: 1px solid var(--border);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.25);
        }
        .weekdays-row {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            text-align: center;
            font-size: 11px;
            font-weight: 800;
            color: var(--text-muted);
            padding-bottom: 8px;
            border-bottom: 1px solid var(--border);
            margin-bottom: 8px;
        }
        .weekdays-row div:first-child { color: #F87171; }
        .weekdays-row div:last-child { color: #60A5FA; }

        .days-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 5px;
        }
        .day-cell {
            min-height: 82px;
            border-radius: 10px;
            padding: 5px 3px;
            border: 1px solid var(--border);
            background: var(--off-bg);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            cursor: pointer;
            position: relative;
            transition: transform 0.1s;
        }
        .day-cell:active { transform: scale(0.95); }
        .day-cell.empty {
            background: transparent;
            border-color: transparent;
            cursor: default;
        }
        .day-cell.today {
            box-shadow: 0 0 0 2px #FFFFFF inset;
        }

        /* 班別專屬顏色 */
        .day-cell.type-reg {
            background: var(--reg-bg);
            border-color: rgba(34, 197, 94, 0.45);
        }
        .day-cell.type-long {
            background: var(--long-bg);
            border-color: rgba(59, 130, 246, 0.5);
        }
        .day-cell.type-night {
            background: var(--night-bg);
            border-color: rgba(245, 158, 11, 0.6);
        }

        .day-num {
            font-size: 12px;
            font-weight: 800;
            align-self: flex-end;
            padding-right: 3px;
            color: var(--text-muted);
            margin-bottom: 3px;
        }
        .day-cell.today .day-num {
            color: #fff;
            background: #EF4444;
            border-radius: 4px;
            padding: 0 4px;
        }

        .shift-pill {
            font-size: 10px;
            font-weight: 800;
            padding: 2px 5px;
            border-radius: 6px;
            margin-bottom: 3px;
            text-align: center;
            line-height: 1.1;
            width: 95%;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .type-reg .shift-pill { background: rgba(34, 197, 94, 0.25); color: var(--reg-text); }
        .type-long .shift-pill { background: rgba(59, 130, 246, 0.3); color: var(--long-text); }
        .type-night .shift-pill { background: rgba(245, 158, 11, 0.3); color: var(--night-text); }

        .shift-time-mini {
            font-size: 9px;
            color: var(--text-main);
            font-weight: 700;
            line-height: 1.15;
            text-align: center;
        }
        .shift-sess-mini {
            font-size: 9px;
            color: var(--text-muted);
            margin-top: 2px;
        }
        .off-dash {
            font-size: 16px;
            color: rgba(255, 255, 255, 0.2);
            margin-top: 14px;
        }

        /* 底部總結備註列 */
        .summary-footer {
            font-size: 12px;
            color: var(--text-muted);
            text-align: center;
            background: rgba(255, 255, 255, 0.03);
            padding: 10px 12px;
            border-radius: 12px;
            border: 1px solid var(--border);
            line-height: 1.5;
        }

        /* 原檔預覽區 */
        .preview-card {
            background: var(--bg-card);
            border-radius: 16px;
            padding: 14px;
            border: 1px solid var(--border);
            display: none;
            flex-direction: column;
            gap: 10px;
        }
        .preview-card img {
            width: 100%;
            border-radius: 10px;
            border: 1px solid var(--border);
        }

        /* 彈出視窗 (上傳 PDF / 編輯單日更表) */
        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(4px);
            z-index: 100;
            align-items: center;
            justify-content: center;
            padding: 16px;
        }
        .modal-box {
            background: var(--bg-card);
            width: 100%;
            max-width: 420px;
            border-radius: 20px;
            padding: 20px;
            border: 1px solid var(--border);
            max-height: 90vh;
            overflow-y: auto;
        }
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 14px;
        }
        .modal-header h3 { margin: 0; font-size: 17px; color: var(--primary); }
        .close-btn {
            background: rgba(255, 255, 255, 0.08);
            border: none;
            color: var(--text-main);
            width: 30px;
            height: 30px;
            border-radius: 8px;
            cursor: pointer;
        }

        .preset-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-bottom: 14px;
        }
        .preset-btn {
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid var(--border);
            color: var(--text-main);
            padding: 10px;
            border-radius: 10px;
            text-align: left;
            cursor: pointer;
            font-size: 12px;
        }
        .preset-btn strong { display: block; font-size: 13px; margin-bottom: 2px; }

        .form-row {
            margin-bottom: 12px;
        }
        .form-row label {
            display: block;
            font-size: 12px;
            color: var(--text-muted);
            margin-bottom: 5px;
        }
        .form-input, .form-select {
            width: 100%;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid var(--border);
            color: var(--text-main);
            padding: 11px;
            border-radius: 10px;
            font-size: 14px;
            outline: none;
        }

        .drop-zone {
            border: 2px dashed rgba(56, 189, 248, 0.45);
            background: rgba(56, 189, 248, 0.05);
            border-radius: 14px;
            padding: 22px 14px;
            text-align: center;
            cursor: pointer;
            margin-bottom: 14px;
        }

        .primary-btn {
            width: 100%;
            background: var(--primary);
            color: #0F172A;
            border: none;
            padding: 13px;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 800;
            cursor: pointer;
        }
    </style>
</head>
<body>

<div class="container">
    <!-- 頂部欄 -->
    <div class="header">
        <div class="header-title">
            <h2>📅 陳鎵榮 (C) 當值排班表</h2>
            <p id="subHeaderText">支援每月上傳 PDF / 圖片自動更新</p>
        </div>
        <button class="upload-trigger-btn" onclick="openUploadModal()">
            📤 上傳新更表
        </button>
    </div>

    <!-- 今日與聽日當值雷達 -->
    <div class="today-banner">
        <div class="banner-col">
            <span class="banner-label" id="todayDateLabel">📍 今日當值</span>
            <span class="banner-shift" id="todayShiftType">--</span>
            <span class="banner-time" id="todayShiftTime">--</span>
            <span class="banner-sub" id="todayShiftSess">--</span>
        </div>
        <div class="banner-col">
            <span class="banner-label" id="tmrDateLabel">⏭️ 聽日預告</span>
            <span class="banner-shift" id="tmrShiftType">--</span>
            <span class="banner-time" id="tmrShiftTime">--</span>
            <span class="banner-sub" id="tmrShiftSess">--</span>
        </div>
    </div>

    <!-- 全月統計看板 -->
    <div class="stats-bar">
        <div class="stat-pill">
            <span>全月當值</span>
            <strong id="statDays">0天</strong>
        </div>
        <div class="stat-pill">
            <span>總節數</span>
            <strong id="statSessions">0節</strong>
        </div>
        <div class="stat-pill">
            <span>總時數</span>
            <strong id="statHours">0小時</strong>
        </div>
        <div class="stat-pill">
            <span>通宵值夜</span>
            <strong id="statNights" style="color:var(--night-text);">0次</strong>
        </div>
    </div>

    <!-- 月份導航與快速印仔開關 -->
    <div class="calendar-controls">
        <div class="month-nav">
            <button class="nav-arrow" onclick="changeMonth(-1)">◀️</button>
            <span class="month-title" id="currentMonthLabel">2026年 11月</span>
            <button class="nav-arrow" onclick="changeMonth(1)">▶️</button>
        </div>
        <button class="stamp-toggle-btn" id="stampModeBtn" onclick="toggleStampMode()">
            🎨 快速印仔排班
        </button>
    </div>

    <!-- 快速排班印仔列 -->
    <div class="stamp-bar" id="stampBar">
        <div style="font-size:12px; color:#FBBF24; font-weight:bold;">
            👇 先揀下面一個印仔，再直接篤月曆日子即可極速排班：
        </div>
        <div class="stamp-list" id="stampList"></div>
    </div>

    <!-- 月曆主體 -->
    <div class="calendar-card">
        <div class="weekdays-row">
            <div>SUN</div>
            <div>MON</div>
            <div>TUE</div>
            <div>WED</div>
            <div>THU</div>
            <div>FRI</div>
            <div>SAT</div>
        </div>
        <div class="days-grid" id="calendarGrid"></div>
    </div>

    <!-- 底部當月文字總結 -->
    <div class="summary-footer" id="summaryFooterText"></div>

    <!-- 已上傳的 PDF / 圖片原檔核對區 -->
    <div class="preview-card" id="rawSheetCard">
        <div style="display:flex; justify-content:space-between; align-items:center;">
            <span style="font-size:13px; font-weight:bold; color:var(--primary);">📄 本月已上傳更表原檔 (可放大核對)</span>
            <button class="close-btn" style="width:auto; padding:0 10px; font-size:11px;" onclick="clearRawSheet()">移除原圖</button>
        </div>
        <img id="rawSheetImg" src="" alt="更表原檔">
    </div>
</div>

<!-- ================= 彈出視窗 1：編輯單日班次 ================= -->
<div class="modal-overlay" id="editDayModal">
    <div class="modal-box">
        <div class="modal-header">
            <h3 id="editModalTitle">編輯當值班次</h3>
            <button class="close-btn" onclick="closeEditModal()">✕</button>
        </div>

        <div style="font-size:12px; color:var(--text-muted); margin-bottom:8px;">⚡ 一鍵套用常用班別：</div>
        <div class="preset-grid" id="presetGrid"></div>

        <div class="form-row">
            <label>班別名稱</label>
            <input type="text" id="inputShiftName" class="form-input" placeholder="例如：常規班 / 長班 / 通宵值夜班 / 放假">
        </div>
        <div class="form-row">
            <label>顏色分類</label>
            <select id="inputShiftColor" class="form-select">
                <option value="reg">🟢 綠色 (常規班 / 短班 / 早班)</option>
                <option value="long">🔵 藍色 (長班)</option>
                <option value="night">🟡 黃色 (通宵值夜班)</option>
                <option value="off">⚪ 放假 (—)</option>
            </select>
        </div>
        <div style="display:grid; grid-template-columns: 1.4fr 0.8fr 0.8fr; gap:8px;">
            <div class="form-row">
                <label>當值時間</label>
                <input type="text" id="inputShiftTime" class="form-input" placeholder="10:00 - 18:00">
            </div>
            <div class="form-row">
                <label>節數</label>
                <input type="number" id="inputShiftSess" class="form-input" placeholder="4">
            </div>
            <div class="form-row">
                <label>時數 (h)</label>
                <input type="number" id="inputShiftHours" class="form-input" placeholder="8">
            </div>
        </div>

        <button class="primary-btn" onclick="saveDayEdit()">💾 儲存更動</button>
    </div>
</div>

<!-- ================= 彈出視窗 2：上傳新月份 PDF / 圖片 ================= -->
<div class="modal-overlay" id="uploadModal">
    <div class="modal-box">
        <div class="modal-header">
            <h3>📤 上傳每月更表 (PDF / 圖片)</h3>
            <button class="close-btn" onclick="closeUploadModal()">✕</button>
        </div>

        <div class="form-row">
            <label>選擇要匯入的目標月份</label>
            <input type="month" id="uploadTargetMonth" class
